 <!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Library.css">
    <link rel="stylesheet" href="Background.css">
</head>
<body data-page-title="libraryPageTitle">
    <div class="animated-bg">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="app-container">
<!-- Sidebar -->
<aside class="sidebar">
    <div class="logo"><span class="logo-name" data-i18n="storeName">Nine Store</span><span class="logo-mark" aria-hidden="true">9</span></div>
    
    <nav class="nav-menu">
        <a href="index.html" data-nav-icon="home"><img class="nav-icon" src="store/svg/home.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="home">Home</span></a>
        <a href="games.html" data-nav-icon="games"><img class="nav-icon" src="store/svg/games.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="games">Games</span></a>
        <a href="apps.html" data-nav-icon="apps"><img class="nav-icon" src="store/svg/apps.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="apps">Apps</span></a>
        <a href="Brick.html" data-nav-icon="products"><img class="nav-icon" src="store/svg/Brick Products.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="products">Brick Products</span></a>
        <a href="Library.html" data-nav-icon="library"><img class="nav-icon" src="store/svg/my library.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="library">My Library</span></a>
        <a href="Settings.html" data-nav-icon="settings"><img class="nav-icon" src="store/svg/settings.svg" alt="" aria-hidden="true"><span class="nav-label" data-i18n="settings">Settings</span></a>
    </nav>
    <button class="sidebar-toggle" type="button" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
        <span></span><span></span><span></span>
    </button>
</aside>

        <main class="main-content">
<div id="downloadStatusBar" class="download-status-bar" role="status" aria-live="polite" style="display: none;">
    <div class="download-info">
        <span id="downloadingGameName" data-i18n="downloading">Downloading...</span>
    </div>
</div>
            <header class="top-bar">
                <h1 data-i18n="libraryTitle">My Library</h1>
            </header>

            <section class="games-section">
                <div class="games-grid" id="libraryGrid">
                </div>
                <div id="emptyLibraryMsg" class="empty-msg" style="display: none;">
                    <span data-i18n="emptyLibrary">Your library is empty. Add games or apps using the "+" button!</span>
                </div>
            </section>
        </main>
    </div>

    <script src="main.js"></script>
    <script src="Library.JS"></script>
    <script src="i18n.js"></script>
    <script src="background.js"></script>
    <script src="app-preferences.js"></script>
</body>
</html>
